[package]
name = "moli-androidtv"
description = "Moli OS: Android / Google TV protocols (Android TV Remote v2 and its pairing, Google Cast) and the generic Android TV driver."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
moli-core.workspace = true
moli-i18n.workspace = true
moli-net.workspace = true
moli-runtime.workspace = true
# The pairing's client certificate: an RSA key (the pairing secret hashes its
# modulus), made once by Moli. `rsa` only generates it; ring signs with it.
rand_core = { version = "0.6", features = ["getrandom"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
ring.workspace = true
rsa = { version = "0.9", default-features = false, features = ["std", "pem"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util"] }
tracing.workspace = true

[dev-dependencies]
rustls.workspace = true
tokio = { workspace = true, features = ["test-util"] }
tokio-rustls.workspace = true

[lints]
workspace = true
