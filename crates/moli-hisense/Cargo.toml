md-5.workspace = true
moli-core.workspace = true
moli-i18n.workspace = true
moli-net.workspace = true
moli-runtime.workspace = true
ring.workspace = true
rumqttc = { workspace = true, features = ["use-rustls-no-provider"] }
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true

[lints]
workspace = true
