[package]
name = "moli-ring"
description = "Moli OS driver for Ring doorbells, cameras and chimes through Ring's own (unofficial) cloud API: presses, motion, battery, Wi-Fi, the last image on demand, the location's mode (disarmed, home, away), with a sign-in made once from the dashboard."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
moli-i18n.workspace = true
anyhow.workspace = true
http.workspace = true
http-body-util.workspace = true
jiff.workspace = true
moli-core.workspace = true
moli-net.workspace = true
moli-runtime.workspace = true
p256.workspace = true
ring.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["io-util"] }
tracing.workspace = true

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
tokio-util.workspace = true

[lints]
workspace = true
