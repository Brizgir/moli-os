<!doctype html><html lang=fr><head><meta charset=utf-8><meta name=viewport content='width=device-width'>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#171c28;text-decoration:none}a:hover{color:#8a4b06}
</style>
</head><body>

<div style="width: 390px; height: 1300px; box-sizing: border-box; font-family: 'Figtree', ui-sans-serif, system-ui, sans-serif; color: #171c28; background: #edf0f5; display: flex; flex-direction: column; position: relative">

  <div style="flex-grow: 1; padding: 22px 16px 110px; display: flex; flex-direction: column; gap: 16px">

    <header style="display: flex; align-items: center; justify-content: space-between; gap: 12px">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <span style="font-size: 13px; color: #6b7386; font-weight: 500">Samedi 18 octobre</span>
        <h1 style="margin: 0; font-size: 28px; font-weight: 700; letter-spacing: -0.03em">Bonjour</h1>
      </div>
      <div style="display: flex; align-items: center; gap: 8px; background: #ffffff; border-radius: 16px; padding: 8px 12px">
        <svg aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#6b7386" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18a4 4 0 0 1 0-8 6 6 0 0 1 11.5 1.5A3.5 3.5 0 0 1 17.5 18z"/></svg>
        <span style="font-size: 22px; font-weight: 700">12°</span>
      </div>
    </header>

    <section aria-label="État de la maison" style="display: flex; align-items: center; gap: 10px; background: #e1f3ef; color: #1d6b5e; border-radius: 14px; padding: 12px 14px; font-weight: 600; font-size: 15px">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l4 4 10-10"/></svg>
      Tout va bien à la maison
    </section>

    <section style="background: #ffffff; border-radius: 22px; padding: 16px; display: flex; flex-direction: column; gap: 12px">
      <div style="display: flex; align-items: center; justify-content: space-between">
        <h2 style="margin: 0; font-size: 17px; font-weight: 700">Chauffage</h2>
        <span style="font-size: 13px; color: #4a5265">nuit à 21 h</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px">
        <div style="background: #f5f7fa; border-radius: 14px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 13px; color: #4a5265; font-weight: 600">Cuisine</span><span style="font-size: 24px; font-weight: 700">20,2°</span><span style="font-size: 12px; color: #6b7386">→ 18°</span></div>
        <div style="background: #f5f7fa; border-radius: 14px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 13px; color: #4a5265; font-weight: 600">Bureau</span><span style="font-size: 24px; font-weight: 700">20,5°</span><span style="font-size: 12px; color: #6b7386">→ 18°</span></div>
        <div style="background: #f5f7fa; border-radius: 14px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 13px; color: #4a5265; font-weight: 600">Chambre</span><span style="font-size: 24px; font-weight: 700">19,5°</span><span style="font-size: 12px; color: #6b7386">→ 18°</span></div>
        <div style="background: #f5f7fa; border-radius: 14px; padding: 10px 12px; display: flex; flex-direction: column; gap: 2px"><span style="font-size: 13px; color: #4a5265; font-weight: 600">Entrée</span><span style="font-size: 24px; font-weight: 700">16,5°</span><span style="font-size: 12px; color: #6b7386">→ 16°</span></div>
      </div>
    </section>

    <section style="background: #ffffff; border-radius: 22px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
      <h2 style="margin: 0; font-size: 17px; font-weight: 700">Lumières</h2>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
        <button type="button" style="font: inherit; min-height: 64px; border-radius: 14px; border: 0; background: #fff2dc; color: #8a4b06; font-weight: 600; cursor: pointer">Entrée</button>
        <button type="button" style="font: inherit; min-height: 64px; border-radius: 14px; border: 0; background: #f5f7fa; color: #171c28; font-weight: 600; cursor: pointer">Salon</button>
        <button type="button" style="font: inherit; min-height: 64px; border-radius: 14px; border: 0; background: #f5f7fa; color: #171c28; font-weight: 600; cursor: pointer">Chambre</button>
      </div>
    </section>

    <section style="background: #ffffff; border-radius: 22px; padding: 16px; display: flex; flex-direction: column; gap: 10px">
      <h2 style="margin: 0; font-size: 17px; font-weight: 700">Sonnette</h2>
      <span style="font-weight: 600">Dernier appui hier à 22 h 24</span>
      <span style="font-size: 13px; color: #6b7386">Mouvement au garage à 22 h 25</span>
    </section>

    <section style="background: #ffffff; border-radius: 22px; padding: 16px; display: flex; align-items: center; gap: 12px">
      <button type="button" aria-label="Lecture" style="width: 48px; height: 48px; border-radius: 50%; border: 0; background: #171c28; color: #ffffff; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg></button>
      <div style="display: flex; flex-direction: column; min-width: 0"><span style="font-weight: 600">Echo Dot garage</span><span style="font-size: 13px; color: #6b7386">En pause · Deezer</span></div>
    </section>
  </div>

  <nav aria-label="Menu principal" style="position: absolute; left: 12px; right: 12px; bottom: 16px; background: #ffffff; border-radius: 24px; padding: 8px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; box-shadow: 0 1px 2px rgb(23 32 56 / 6%), 0 16px 40px -14px rgb(23 32 56 / 24%)">
    <a href="#" aria-current="page" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 56px; border-radius: 16px; background: #edf0f5; font-size: 11px; font-weight: 600">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Accueil</a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 56px; border-radius: 16px; font-size: 11px; font-weight: 500; color: #4a5265">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>Pièces</a>
    <a href="#" aria-label="Demander à Moli" style="display: flex; align-items: center; justify-content: center; min-height: 56px">
      <span aria-hidden="true" style="width: 46px; height: 46px; border-radius: 50%; background: #f0a53a; box-shadow: 0 0 0 6px #fff2dc"></span></a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 56px; border-radius: 16px; font-size: 11px; font-weight: 500; color: #4a5265">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3c2 3 5 5 5 9a5 5 0 0 1-10 0c0-2 1-3 2-4 0 2 1 3 2 3 0-3-1-5 1-8z"/></svg>Chauffage</a>
    <a href="#" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-height: 56px; border-radius: 16px; font-size: 11px; font-weight: 500; color: #4a5265">
      <svg aria-hidden="true" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="5" cy="12" r="1.6"/><circle cx="12" cy="12" r="1.6"/><circle cx="19" cy="12" r="1.6"/></svg>Plus</a>
  </nav>
</div>
</body></html>
