[integration]
id = "ring"
name = "Ring (sonnettes, caméras, carillons)"
brands = ["Ring"]
# Kinds recognized for battery, light and siren; any other kind still
# gets its rings, motion, Wi-Fi and images.
models = ["Video Doorbell", "Doorbell Pro", "Stick Up Cam", "Spotlight Cam", "Floodlight Cam", "Indoor Cam", "Chime"]
transport = "https"
driver = "ring"
crate = "moli-ring"

[discovery]
# Cloud only: nothing to find on the network.
mdns = []
ssdp = []
ports = [443]

[needs]
# `refresh_token` and `hardware_id` are written by the driver itself;
# `code_2fa` is asked for when Ring sends one, then forgotten.
secrets = ["email", "password"]
vars = []
options = []

[origin]
reused = "aucun code repris : API lue dans l'intégration ring de Home Assistant (Apache-2.0) et la bibliothèque python-ring-doorbell (LGPL-3.0), réécrite en Rust"
author = "agent"

# Answers shaped like Ring's (fictitious values), read by crates/moli-ring.
[[fixture]]
file = "fixtures/ring_devices.json"

[[fixture]]
file = "fixtures/ring_history.json"

[[fixture]]
file = "fixtures/ring_health.json"

[[fixture]]
file = "fixtures/ring_oauth_2fa.json"
