[integration]
id = "ring"
name = "Sonnettes et carillons Ring"
# Unofficial: the Ring app's own cloud API, which Ring may change at any
# time. Ring devices answer nothing on the home network.
brands = ["Ring"]
models = ["Video Doorbell", "Battery Doorbell", "Chime", "Chime Pro", "Stick Up Cam"]
transport = "https"
driver = "ring"
crate = "moli-ring"

[discovery]
# A cloud account: nothing to find on the home network.
mdns = []
ssdp = []
ports = []

[needs]
# Given by the dashboard's sign-in, never typed into a file.
secrets = ["refresh_token", "hardware_id"]
vars = []
options = []

[origin]
reused = ""
author = "agent"

# Replayed by the crate's tests (crates/moli-ring/src/{auth,api,signin,model}.rs).
[[fixture]]
file = "fixtures/ring-devices.json"

[[fixture]]
file = "fixtures/doorbot-health.json"

[[fixture]]
file = "fixtures/events.json"

[[fixture]]
file = "fixtures/history.json"

[[fixture]]
file = "fixtures/oauth-token.json"

[[fixture]]
file = "fixtures/oauth-2fa.json"

[[fixture]]
file = "fixtures/oauth-bad-code.json"

[[fixture]]
file = "fixtures/oauth-bad-password.json"

[[fixture]]
file = "fixtures/oauth-bad-refresh.json"
